<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product - AgriDirect</title>
    <link rel="stylesheet" href="../CSS/addproduct-f.css" />
    <link rel="icon" href="../ASSETS/image.png" />
  </head>

  <body>
    <header class="header">
      <div class="logo-section">
        <div class="logo">
          <a href="../index.html">
            <img
              src="../ASSETS/image.png"
              width="60"
              height="60"
              alt="AgriDirect Logo"
              onerror="this.style.display = 'none'"
            />
          </a>
        </div>
        <div class="brand-text">
          <h1>AgriDirect</h1>
        </div>
      </div>
      <div class="user-section">
        <a href="">
          <div class="user-avatar">F</div>
        </a>
        <a href="../index.html">
          <button class="logout-btn">Logout</button>
        </a>
      </div>
    </header>

    <div class="container">
      <div class="form-card">
        <form id="productForm">
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="product-name" required />
          </div>

          <div class="form-group">
            <label>Category</label>
            <select id="category" required>
              <option value="">Select</option>
              <option value="vegetables">Vegetables</option>
              <option value="fruits">Fruits</option>
              <option value="grains">Grains</option>
              <option value="dairy">Dairy</option>
            </select>
          </div>

          <div class="form-group">
            <label>Quantity (kg)</label>
            <input type="number" id="quantity" placeholder="e.g., 500 kg" />
          </div>

          <div class="form-group">
            <label>Price per kg (₹)</label>
            <input type="number" id="price" placeholder="e.g., 45" />
          </div>

          <div class="form-group">
            <label>Market price per kg (₹)</label>
            <input type="number" id="market-price"  placeholder="e.g., 52" />
          </div>

          <div class="form-group">
            <label>Product Image URL</label>
            <input
              type="url"
              id="image_url"
              placeholder="https://example.com/image.jpg"
              required
            />
          </div>

          <div class="form-group">
            <label>Quality Grade</label>
            <select id="quality_grade" required>
              <option value="">Select</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Standard">Standard</option>
            </select>
          </div>

          <button type="submit" class="submit-btn">Add Product</button>
        </form>
      </div>
    </div>

    <script src="../JS/addproduct-f.js"></script>
  </body>
</html>
