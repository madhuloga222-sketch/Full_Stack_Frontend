<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Write a Review Modal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/reviews-v.css" />
    <link rel="icon" href="../ASSETS/image.png" />
  </head>
  <body>
    <div class="backdrop">
      <div class="modal">
        <a href="../HTML/suppliers-v.html">
          <button
            class="close-btn"
            onclick="this.closest('.backdrop').style.display = 'none'"
          >
            ✕
          </button></a
        >
        <h2>Write a Review</h2>

        <div class="form-group">
          <label for="farmer">Type the Farmer name</label>
          <!-- <div class="select-wrapper"></div> -->
          <input type="text" id="product-name" required />
        </div>

        <div class="rating-group">
          <label>Rating</label>
          <div class="stars">
            <input type="radio" name="rating" id="s5" value="5" />
            <label for="s5">★</label>
            <input type="radio" name="rating" id="s4" value="4" />
            <label for="s4">★</label>
            <input type="radio" name="rating" id="s3" value="3" />
            <label for="s3">★</label>
            <input type="radio" name="rating" id="s2" value="2" />
            <label for="s2">★</label>
            <input type="radio" name="rating" id="s1" value="1" />
            <label for="s1">★</label>
          </div>
        </div>

        <div class="review-group">
          <label for="review">Your Review</label>
          <textarea
            id="review"
            placeholder="Share your experience..."
          ></textarea>
        </div>

        <!-- Submit -->
        <!-- <a href="../HTML/suppliers-v.html"
          ><button class="submit-btn">Submit Review</button></a
        > -->

        <button class="submit-btn">Submit Review</button>

      </div>
    </div>
    <script src="../JS/reviews-v.js"></script>
  </body>
</html>
