<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriDirect - Edit Product</title>
    <link rel="stylesheet" href="../CSS/edit-f.css" />
    <link rel="icon" href="../ASSETS/image.png" />
  </head>
  <body>
    <header class="header">
      <div class="logo-section">
        <div class="logo">
          <img src="/ASSETS/image.png" width="60px" height="60px" />
        </div>
        <div class="brand-info">
          <h1>AgriDirect</h1>
        </div>
      </div>
      <div class="user-section">
        <div class="user-avatar">F</div>
        <a href="/INDEX.HTML" class="logout-btn">
          <span>Logout</span>
        </a>
      </div>
    </header>

    <main class="main-content">
      <div class="form-container">
        <div class="form-header">
          <h2>Edit Product</h2>
          <p>Update your fresh produce details</p>
        </div>

        <form id="productFormEdit">
          <div class="form-row">
            <div class="form-group">
              <label for="productName">Product Name</label>
              <input type="text" id="productName" />
            </div>
            <div class="form-group">
              <label for="category">Category</label>
              <select id="category">
                <option value="">Select category</option>
                <option value="vegetables">Vegetables</option>
                <option value="fruits">Fruits</option>
                <option value="grains">Grains</option>
                <option value="dairy">Dairy</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="quantity">Quantity Available</label>
              <input type="text" id="quantity" />
            </div>
            <div class="form-group">
              <label for="price">Price per kg (₹)</label>
              <input type="number" id="price" />
            </div>
            <div class="form-group">
              <label for="market-price">Market per kg (₹)</label>
              <input type="number" id="market-price" />
            </div>
            <div class="form-group">
              <label>Product Image URL</label>
              <input
                type="url"
                id="image_url"
                placeholder="https://example.com/image.jpg"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group full-width">
              <label for="quality">Quality Grade</label>
              <select id="quality">
                <option value="">Select quality grade</option>

                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="standard">Standard</option>
              </select>
            </div>
          </div>

          <div class="button-group">
            <a href="/HTML/products-f.html">
              <button type="button" class="btn btn-cancel">Cancel</button>
            </a>
            <button type="submit" class="btn btn-save">Save Changes</button>
          </div>
        </form>
      </div>
    </main>

    <script src="../JS/edit-f.js"></script>
  </body>
</html>
