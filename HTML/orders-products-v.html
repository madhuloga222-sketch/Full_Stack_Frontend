<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriDirect - Vendor Dashboard</title>
    <link rel="stylesheet" href="../CSS/orders-products-v.css" />
    <link rel="icon" href="../ASSETS/image.png" />
  </head>

  <body>
    <header class="header">
      <div class="logo-section">
        <div class="logo">
          <img src="../ASSETS/image.png" width="60" height="60" alt="AgriDirect Logo" />
        </div>
        <div class="brand-text">
          <h1>AgriDirect</h1>
        </div>
      </div>
      <div class="user-section">
        <a href="./farmer-dashboard.html">
          <div class="user-avatar">V</div>
        </a>
        <a href="../index.html">
          <button class="logout-btn">Logout</button>
        </a>
      </div>
    </header>

    <div class="order-card">
      <div class="order-header">
        <h1>Order Product</h1>
      </div>

      <div class="product-details">
        <h2>Product Details</h2>
        <div class="details-grid">
          <div class="detail-item">
            <div class="detail-label">Product:</div>
            <!-- ✅ id சேர்த்தோம் — JS dynamic-ஆ fill பண்ணும் -->
            <div class="detail-value" id="detail-product">Loading...</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Farmer:</div>
            <div class="detail-value" id="detail-farmer">Loading...</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Location:</div>
            <div class="detail-value" id="detail-location">Loading...</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Price:</div>
            <div class="detail-value" id="detail-price">Loading...</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Available:</div>
            <div class="detail-value" id="detail-available">Loading...</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Quality:</div>
            <div class="detail-value" id="detail-quality">Loading...</div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="name">Your Name/Business Name</label>
        <input type="text" id="name" placeholder="Enter your name or business name" />
      </div>

      <div class="form-group">
        <label for="phone">Your Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter your phone number" />
      </div>

      <div class="form-group">
        <label for="quantity">Quantity Needed (kg)</label>
        <input type="number" id="quantity" placeholder="e.g., 100" min="1" />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Write your message to the farmer. Include details about delivery preferences, timing, or any specific requirements..."></textarea>
      </div>

      <div class="btn-row">
        <a href="../HTML/products-v.html">
          <button class="btn btn-cancel">Cancel</button>
        </a>
        <!-- ✅ href போக்கி JS handle பண்றோம் -->
        <button class="btn btn-place">Place Order</button>
      </div>
    </div>

    <script src="../JS/orders-products-v.js"></script>
  </body>
</html>
