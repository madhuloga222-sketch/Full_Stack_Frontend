      </div>
      <nav>
        <a href="../index.html" class="btn-login">Logout</a>
      </nav>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <ul>
          <a href="../HTML/farmer.html" class="nav-item"
            ><li>
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
                />
              </svg>
              Dashboard
            </li></a
          >

          <a href="../HTML/products-f.html" class="nav-item"
            ><li>
              <img src="../ASSETS/box-open.png" width="22px" height="22px" />
              My Products
            </li></a
          >

          <a href="../HTML/orders-f.html" class="nav-item"
            ><li>
              <img src="../ASSETS/cart.png1.png" width="22px" height="22px" />
              Orders
            </li></a
          >

          <!-- <a href="/HTML/analytics.html" class="nav-item"
            ><li>
              <img
                src="../ASSETS/Data-Driven Insights1.png"
                width="22px"
                height="22px"
              />
              Earnings
            </li></a
          > -->

          <a href="../HTML/reviews-f.html" class="nav-item"
            ><li>
              <img src="../ASSETS/feedback.png" width="22px" height="22px" />
              Reviews
            </li></a
          >

          <a href="../HTML/farmer-dashboard.html" class="nav-item active"
            ><li class="active">
              <img src="../ASSETS/user.png" width="22px" height="22px" />
              Profile
            </li></a
          >
        </ul>
      </aside>

      <main class="content">
        <h1>Profile</h1>
        <p class="subtitle">Manage your account information</p>
        <div class="top-cards">
         
          <div class="card profile-card">
            <div class="avatar" id="edit-avatar">R</div>
            <h3 id="edit-name">ragul</h3>
            <p id="edit-email">ragul08@gmail.com</p>
            <span class="badge">Farmer</span>
          </div>

          <div class="card details-card">
            <div class="card-header">
              <h3>Account Details</h3>
              <div>
                <a href="../HTML/farmer-dashboard.html">
                  <button class="btn cancel">Cancel</button>
                </a>
                
                <button class="btn save" id="save-btn">Save</button>
              </div>
            </div>

            <div class="field">
              <label>Full Name</label>
              <input type="text" id="full_name" placeholder="Enter full name" />
            </div>

            <div class="field">
              <label>Email Address</label>
              <input type="email" id="email" placeholder="Enter email" />
            </div>

            <div class="field">
              <label>Phone Number</label>
              <input type="text" id="phone" placeholder="Enter phone number" />
            </div>

            <div class="field">
              <label>Location</label>
              <input type="text" id="location" placeholder="Enter location" />
            </div>
          </div>
        </div>

        <div class="card stats">
          <div>
            <h2 class="green">6</h2>
            <p>Products Listed</p>
          </div>
          <div>
            <h2 class="blue">12</h2>
            <p>Total Orders</p>
          </div>
          <div>
            <h2 class="orange">4.8</h2>
            <p>Average Rating</p>
          </div>
          <!-- <div>
            <h2>3 Months</h2>
            <p>Member Since</p>
          </div> -->
        </div>
      </main>
    </div>

    <script src="../JS/farmer-dashboard-edit.js"></script>
